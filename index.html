<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Castillo VR: física, agarrar, sonido, panel, lanzar, girar, correr y basketball</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1) A-Frame: el motor 3D/VR -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- 2) Librería de física. Agrega dos componentes:
          static-body  → objeto FIJO: no se mueve, pero las cosas chocan con él (muros, piso)
          dynamic-body → objeto con MASA: cae por gravedad, rebota y choca -->
  <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    /* =====================================================================
       AJUSTES QUE PUEDES CAMBIAR
       ===================================================================== */
    const RAPIDEZ_JUGADOR = 3;      // metros por segundo al caminar
    const RAPIDEZ_CORRER = 6;       // metros por segundo al correr (Shift o grip izquierdo)
    const RADIO_PIES = 0.35;        // tamaño de la esfera de los pies (metros)
    const FUERZA_SALTO = 5;         // velocidad hacia arriba al saltar (m/s). Con 5 sube ~1.3 m
    const RADIO_ESFERA = 0.12;      // tamaño de las esferas que se agarran (metros)
    const ESFERAS_POR_COLOR = 3;    // cuántas esferas hay de cada color

    // --- Canastas (basketball) ---
    const RADIO_ARO = 0.4;          // radio del aro (metros). Más pequeño = más difícil
    const DURACION_AVISO = 1000;    // cuánto dura en pantalla el aviso "ROJO: 1/3" (milisegundos)

    // --- Límites del castillo (el patio, con la terraza) ---
    // Si una esfera suelta queda fuera de este rectángulo, regresa a la cesta del principio.
    const CASTILLO = { xMin: -5.2, xMax: 5.2, zMin: -10.2, zMax: 0.2 };

    // --- Lanzar la esfera que tienes agarrada ---
    const VELOCIDAD_LANZAMIENTO = 10;  // velocidad inicial al lanzar (m/s)

    // --- Giro con el joystick derecho (por pasos) ---
    const PASO_GIRO = 50;              // grados por paso
    const ZONA_MUERTA_GIRO = 0.7;      // la palanca debe pasar de este valor (0 a 1) para girar
    const UMBRAL_CENTRO_GIRO = 0.3;    // la palanca debe bajar de este valor para permitir otro paso

    // Los colores del juego. Debe haber una canasta con el mismo "nombre"
    // (mira las <a-entity canasta="color: ..."> más abajo en el HTML).
    const COLORES = [
      { nombre: 'rojo',     hex: '#E53935' },
      { nombre: 'verde',    hex: '#43A047' },
      { nombre: 'azul',     hex: '#1E88E5' },
      { nombre: 'amarillo', hex: '#FDD835' }
    ];

    const TOTAL = COLORES.length * ESFERAS_POR_COLOR; // cuántas esferas hay que encestar

    // Propiedades de física de las esferas (las usamos en varios lugares)
    const FISICA_ESFERA = 'mass: 1; linearDamping: 0.3; angularDamping: 0.5';

    let colocadas = 0;              // cuántas esferas ya se encestaron en su canasta
    const conteo = {};              // cuántas van por color (ej. conteo.rojo = 1)
    COLORES.forEach(function (c) { conteo[c.nombre] = 0; });
    const teclas = {};              // qué teclas están presionadas
    const palanca = { x: 0, y: 0 }; // joystick izquierdo del control del Quest
    let quiereSaltar = false;       // se pone en true al presionar Espacio o el botón A
    let corriendoGrip = false;      // true mientras mantienes el grip izquierdo del Quest

    // Qué esfera tiene agarrada cada mano (control del Quest o la cámara/mouse).
    // Clave: la mano. Valor: el componente "agarrable" de la esfera que sostiene.
    const manosOcupadas = new Map();


    // ¿Esta posición quedó fuera del castillo?
    function fueraDelCastillo(p) {
      return p.x < CASTILLO.xMin || p.x > CASTILLO.xMax ||
             p.z < CASTILLO.zMin || p.z > CASTILLO.zMax;
    }


    /* =====================================================================
       JUGADOR CON ESFERA EN LOS PIES
       El jugador es una esfera física invisible (dynamic-body).
       - Nosotros le damos la velocidad HORIZONTAL (adelante, atrás, lados).
       - La gravedad se encarga de la VERTICAL (por eso baja y sube rampas).
       - Como es un cuerpo físico, no atraviesa muros y empuja las esferas.
       La cámara (#rig) solo copia la posición de esta esfera.
       ===================================================================== */
    AFRAME.registerComponent('jugador', {
      tick: function () {
        const cuerpo = this.el.body;           // el cuerpo físico (Cannon.js)
        if (!cuerpo) return;                   // aún no se crea

        const camara = document.querySelector('#camara').getObject3D('camera');
        if (!camara) return;                   // la cámara aún no se crea

        // 1. ¿Hacia dónde quiere moverse? Teclado (WASD) o palanca del Quest
        let lado = 0, adelante = 0;
        if (teclas.KeyW) adelante += 1;
        if (teclas.KeyS) adelante -= 1;
        if (teclas.KeyD) lado += 1;
        if (teclas.KeyA) lado -= 1;
        lado += palanca.x;
        adelante -= palanca.y;                 // en la palanca, empujar adelante da y negativa

        // 1b. ¿Corre? Shift en la computadora o grip izquierdo en el Quest
        const corriendo = teclas.ShiftLeft || teclas.ShiftRight || corriendoGrip;
        const rapidez = corriendo ? RAPIDEZ_CORRER : RAPIDEZ_JUGADOR;

        // 2. ¿Hacia dónde está mirando la cámara? (solo en el plano del piso)
        //    Usamos la cámara real: su dirección ya incluye los giros del joystick derecho.
        //    getWorldDirection de una cámara ya apunta "al frente" (-Z), sin invertir.
        const frente = new THREE.Vector3();
        camara.getWorldDirection(frente);
        frente.y = 0;
        frente.normalize();
        const derecha = new THREE.Vector3(-frente.z, 0, frente.x);

        // 3. Velocidad = dirección × rapidez. La velocidad en Y no la tocamos (gravedad).
        cuerpo.velocity.x = (frente.x * adelante + derecha.x * lado) * rapidez;
        cuerpo.velocity.z = (frente.z * adelante + derecha.z * lado) * rapidez;
        cuerpo.angularVelocity.set(0, 0, 0);   // que la esfera no ruede
        cuerpo.wakeUp();                       // que el motor no la "duerma"

        // 4. SALTO: solo si está en el piso. Truco sencillo: si casi no se mueve
        //    en vertical (ni sube ni cae), suponemos que está parado en algo.
        //    Le damos velocidad hacia arriba y la gravedad lo vuelve a bajar.
        if (quiereSaltar) {
          if (Math.abs(cuerpo.velocity.y) < 0.1) {
            cuerpo.velocity.y = FUERZA_SALTO;
          }
          quiereSaltar = false;                // un salto por cada vez que presionas
        }

        // 5. Si se cae del mundo, regresa a la entrada
        if (cuerpo.position.y < -5) {
          cuerpo.position.set(0, RADIO_PIES, 4);
          cuerpo.velocity.set(0, 0, 0);
        }

        // 6. La cámara sigue a la esfera (los pies quedan en la parte de abajo)
        const p = this.el.object3D.position;
        document.querySelector('#rig').object3D.position.set(p.x, p.y - RADIO_PIES, p.z);
      }
    });


    /* =====================================================================
       CREAR LAS ESFERAS EN LA CESTA
       En vez de escribir 12 <a-sphere> a mano en el HTML, las creamos con
       un ciclo. Se acomodan en una cuadrícula arriba de la cesta y caen
       dentro gracias a la gravedad. Los colores se van alternando.
       ===================================================================== */
    AFRAME.registerComponent('crear-esferas', {
      init: function () {
        const escena = this.el.sceneEl;
        const columnas = 4;                    // esferas por fila en la cuadrícula

        for (let i = 0; i < TOTAL; i++) {
          const color = COLORES[i % COLORES.length];   // 0,1,2,3,0,1,2,3...
          const columna = i % columnas;                // posición en la fila
          const fila = Math.floor(i / columnas);       // número de fila

          // Posición inicial: encima de la cesta (centro en x = 2.5, z = -3)
          const x = 2.05 + columna * 0.3;
          const z = -2.6 - fila * 0.4;
          const y = 0.8 + fila * 0.3;                  // cada fila cae un poco después

          // Creamos la esfera igual que si la escribiéramos en el HTML
          const esfera = document.createElement('a-sphere');
          esfera.setAttribute('position', x + ' ' + y + ' ' + z);
          esfera.setAttribute('radius', RADIO_ESFERA);
          esfera.setAttribute('color', color.hex);
          esfera.setAttribute('class', 'agarrable');   // para que el mouse/láser la detecte
          esfera.setAttribute('agarrable', 'color: ' + color.nombre);
          esfera.setAttribute('dynamic-body', FISICA_ESFERA);
          escena.appendChild(esfera);
        }

        actualizarPanel();                     // que el panel muestre "0 / TOTAL"
      }
    });


    /* =====================================================================
       CANASTA DE BASKETBALL
       Cada color tiene su propia canasta: poste, tablero, aro y red.
       Todo se crea con JavaScript en coordenadas del mundo (sin entidades
       anidadas) para que los cuerpos físicos queden justo donde se ven.
       - El poste, el tablero y el aro son static-body: las esferas rebotan en ellos
         (¡puedes meter la esfera "de rebote" en el tablero!).
       - El centro del aro está VACÍO, así que la esfera puede caer por el hueco.
       - Debajo del aro cuelga un TUBO del color de la canasta (con un embudo arriba).
         Cuando la esfera de ese color entra por el aro, se guarda en el tubo y se apila.
       - cruce(): avisa si una esfera acaba de atravesar el aro de arriba hacia abajo.
       - guardar(): mete la esfera en el tubo.  vaciar(): deja el tubo sin esferas (al reiniciar).

       Parámetros (se escriben en el HTML, en <a-entity canasta="...">):
         color     → qué color de esfera acepta (igual que en COLORES)
         posicion  → base del poste: x, y del piso (0, o 1.2 sobre la terraza), z
         giro      → hacia dónde mira el aro, en grados:
                     0 = hacia +X · 90 = hacia -Z (fondo) · 180 = hacia -X · -90 = hacia +Z (la puerta)
         altura    → altura del aro sobre la base (m). El de un juego real mide 3.05 m
         radio     → radio del aro (por defecto RADIO_ARO)
       ===================================================================== */
    AFRAME.registerComponent('canasta', {
      schema: {
        color:    { type: 'string' },
        posicion: { type: 'vec3' },
        giro:     { type: 'number', default: 0 },
        altura:   { type: 'number', default: 2.2 },
        radio:    { type: 'number', default: RADIO_ARO }
      },

      init: function () {
        const d = this.data;
        const info = COLORES.find(function (c) { return c.nombre === d.color; });
        const hex = info ? info.hex : '#FFFFFF';
        const H = d.altura;                    // altura del aro
        const CX = 0.65;                       // el centro del aro queda 0.65 m al frente del poste

        // Sistema local: origen en la base del poste, +x hacia donde mira el aro
        const marco = new THREE.Object3D();
        marco.position.set(d.posicion.x, d.posicion.y, d.posicion.z);
        marco.rotation.y = d.giro * Math.PI / 180;
        marco.updateMatrixWorld(true);
        const P = function (x, y, z) { return marco.localToWorld(new THREE.Vector3(x, y, z)); };

        this.centro = P(CX, H, 0);             // centro del aro en el mundo (para detectar la encestada)
        this.cantidad = 0;                     // cuántas esferas hay guardadas en el tubo

        const escena = this.el.sceneEl;
        const crear = function (tag, pos, attrs, rot) {
          const el = document.createElement(tag);
          Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
          el.setAttribute('position', { x: pos.x, y: pos.y, z: pos.z });
          if (rot) el.setAttribute('rotation', rot);
          escena.appendChild(el);
          return el;
        };
        const giro = { x: 0, y: d.giro, z: 0 };

        // --- Poste (con física) y base de color (solo decoración) ---
        crear('a-cylinder', P(0, (H + 0.6) / 2, 0), {
          radius: 0.06, height: H + 0.6, color: '#546E7A', 'static-body': ''
        });
        crear('a-cylinder', P(0, 0.02, 0), { radius: 0.25, height: 0.04, color: hex });

        // --- Tablero translúcido del color de la canasta (con física) ---
        crear('a-box', P(0.11, H + 0.25, 0), {
          width: 0.08, height: 0.8, depth: 1.2,
          material: 'color: ' + hex + '; opacity: 0.3; transparent: true', 'static-body': ''
        }, giro);

        // --- Marco y cuadro de puntería del tablero, del color de la canasta (solo decoración) ---
        const linea = function (y, z, alto, prof) {
          crear('a-box', P(0.16, y, z), {
            width: 0.02, height: alto, depth: prof, color: hex
          }, giro);
        };
        linea(H + 0.63, 0, 0.04, 1.2);   linea(H - 0.13, 0, 0.04, 1.2);      // marco: arriba y abajo
        linea(H + 0.25, -0.58, 0.8, 0.04); linea(H + 0.25, 0.58, 0.8, 0.04); // marco: lados
        linea(H + 0.42, 0, 0.03, 0.6);   linea(H + 0.08, 0, 0.03, 0.6);      // cuadro de puntería
        linea(H + 0.25, -0.3, 0.34, 0.03); linea(H + 0.25, 0.3, 0.34, 0.03);

        // --- Soporte entre el tablero y el aro (decoración) ---
        crear('a-box', P(0.2, H, 0), { width: 0.1, height: 0.04, depth: 0.06, color: hex }, giro);

        // --- Aro: anillo de cajitas estáticas con el centro VACÍO ---
        const SEG = 16, GROSOR = 0.05;
        const largo = 2 * d.radio * Math.sin(Math.PI / SEG) * 1.12;    // 12 % de traslape
        for (let k = 0; k < SEG; k++) {
          const a = (k / SEG) * Math.PI * 2;
          crear('a-box', P(CX + Math.cos(a) * d.radio, H, Math.sin(a) * d.radio), {
            width: largo, height: GROSOR, depth: GROSOR, color: hex, 'static-body': ''
          }, { x: 0, y: d.giro - (a * 180 / Math.PI) - 90, z: 0 });
        }

        // --- Tubo de color debajo del aro (donde se guardan las esferas) ---
        // Un embudo baja desde el aro hasta el tubo. Son solo visuales: la esfera encestada
        // se coloca dentro del tubo con guardar(). El tubo mide lo justo para apilar todas.
        const RADIO_TUBO = 0.18, ALTO_EMBUDO = 0.3;
        const altoTubo = ESFERAS_POR_COLOR * RADIO_ESFERA * 2 + 0.1;
        const vidrio = 'color: ' + hex + '; opacity: 0.4; transparent: true; side: double';

        crear('a-cylinder', P(CX, H - ALTO_EMBUDO / 2, 0), {
          'radius-top': d.radio, 'radius-bottom': RADIO_TUBO, height: ALTO_EMBUDO,
          'open-ended': true, 'segments-radial': 16, material: vidrio
        });
        const centroTubo = P(CX, H - ALTO_EMBUDO - altoTubo / 2, 0);
        crear('a-cylinder', centroTubo, {
          radius: RADIO_TUBO, height: altoTubo, 'open-ended': true,
          'segments-radial': 16, material: vidrio
        });
        this.tubo = { x: centroTubo.x, z: centroTubo.z, fondo: centroTubo.y - altoTubo / 2 };
      },

      /* ¿La esfera atravesó el aro de arriba hacia abajo entre la posición
         anterior (a) y la actual (b)? Con la esfera lanzada rápido puede avanzar
         varios centímetros por cuadro, así que calculamos DÓNDE cruzó el plano del aro. */
      cruce: function (a, b) {
        const c = this.centro;
        if (!c || !(a.y > c.y && b.y <= c.y)) return false;
        const t = (a.y - c.y) / (a.y - b.y);                 // qué parte del trayecto ocurrió antes de cruzar
        const x = a.x + (b.x - a.x) * t;
        const z = a.z + (b.z - a.z) * t;
        // Debe cruzar por dentro del aro (la esfera completa, no solo su centro)
        return Math.hypot(x - c.x, z - c.z) < this.data.radio - RADIO_ESFERA;
      },

      // Mete la esfera en el tubo y la apila encima de las que ya hay
      guardar: function (esferaEl) {
        const t = this.tubo;
        esferaEl.removeAttribute('dynamic-body');            // sin física para que se quede quieta
        esferaEl.object3D.position.set(
          t.x,
          t.fondo + RADIO_ESFERA + this.cantidad * RADIO_ESFERA * 2,   // la primera toca el fondo
          t.z
        );
        this.cantidad++;
      },

      vaciar: function () {
        this.cantidad = 0;
      }
    });


    /* =====================================================================
       CONCEPTO 1: AGARRAR, SOLTAR Y LANZAR (con física)
       - Al presionar sobre la esfera: le QUITAMOS la física (si no, la gravedad
         la jalaría) y la pegamos a la mano con attach().
       - Al soltar: la regresamos a la escena y le DEVOLVEMOS la física,
         así que cae desde donde la dejaste.
       - Al LANZAR: igual que soltar, pero además le damos una velocidad inicial
         (VELOCIDAD_LANZAMIENTO) hacia donde apunta la mano. Solo se puede lanzar
         una esfera que tienes agarrada.
       - Si atraviesa el aro de SU color, se guarda en el tubo de esa canasta y cuenta.
       - Si atraviesa el aro de OTRO color, regresa a la cesta.
       - Si sale del castillo (o se cae del mundo), regresa a la cesta del principio.
       En Unity esto es el componente "XR Grab Interactable".
       ===================================================================== */
    AFRAME.registerComponent('agarrable', {
      schema: {
        color: { type: 'string' }    // el color de esta esfera (ej. "rojo")
      },

      init: function () {
        this.mano = null;            // quién la tiene agarrada (null = nadie)
        this.colocada = false;       // ¿ya la encestaste en su canasta?
        this.velocidadPendiente = null;   // velocidad que se aplica justo al lanzarla
        this.posicionInicial = this.el.object3D.position.clone();
        this.anterior = new THREE.Vector3();   // dónde estaba en el cuadro anterior
        this.hayAnterior = false;              // (para saber de dónde viene al cruzar un aro)

        this.agarrar = this.agarrar.bind(this);
        this.soltar = this.soltar.bind(this);

        // "mousedown" lo manda el cursor (mouse) o el láser del Quest (gatillo)
        this.el.addEventListener('mousedown', this.agarrar);
      },

      agarrar: function (evento) {
        if (this.colocada || this.mano) return;

        const mano = evento.detail.cursorEl;               // el control o la cámara
        if (manosOcupadas.has(mano)) return;               // esa mano ya sostiene otra esfera

        this.velocidadPendiente = null;
        this.hayAnterior = false;
        this.el.removeAttribute('dynamic-body');           // sin física mientras la cargas
        this.mano = mano;
        manosOcupadas.set(mano, this);                     // así sabemos qué esfera puede lanzar esa mano
        this.mano.object3D.attach(this.el.object3D);       // ahora se mueve con la mano
        this.mano.addEventListener('mouseup', this.soltar);
      },

      // Suelta la esfera de la mano y le devuelve la física (lo usan soltar y lanzar)
      liberar: function () {
        if (!this.mano) return false;
        this.mano.removeEventListener('mouseup', this.soltar);
        manosOcupadas.delete(this.mano);
        this.mano = null;

        this.el.sceneEl.object3D.attach(this.el.object3D); // de regreso a la escena
        this.el.setAttribute('dynamic-body', FISICA_ESFERA);
        return true;
      },

      soltar: function () {
        this.liberar();
      },

      lanzar: function (direccion) {
        if (!this.liberar()) return;                       // solo si estaba agarrada
        this.velocidadPendiente = direccion.clone().normalize()
          .multiplyScalar(VELOCIDAD_LANZAMIENTO);
        this.aplicarVelocidad();
      },

      // Da la velocidad de lanzamiento en cuanto el cuerpo físico existe
      aplicarVelocidad: function () {
        const cuerpo = this.el.body;
        if (!this.velocidadPendiente || !cuerpo) return;
        const v = this.velocidadPendiente;
        cuerpo.velocity.set(v.x, v.y, v.z);
        cuerpo.wakeUp();
        this.velocidadPendiente = null;
      },

      // tick se ejecuta en cada cuadro
      tick: function () {
        this.aplicarVelocidad();                           // por si el cuerpo se creó un cuadro tarde
        if (this.colocada) return;
        if (this.mano) { this.hayAnterior = false; return; }

        const posicion = this.el.object3D.position;

        // Si salió del castillo (por ejemplo, lanzada por encima de los muros)
        // o se cayó del mundo, regresa a la cesta del principio
        if (posicion.y < -5 || fueraDelCastillo(posicion)) {
          this.reiniciar();
          return;
        }

        // ¿Atravesó algún aro entre el cuadro anterior y este?
        if (this.hayAnterior) {
          const canastas = document.querySelectorAll('[canasta]');

          for (const el of canastas) {
            const canasta = el.components.canasta;
            if (!canasta || !canasta.cruce(this.anterior, posicion)) continue;

            if (canasta.data.color === this.data.color) {
              // Aro correcto: se guarda en el tubo de la canasta. Ya no se puede volver a agarrar
              canasta.guardar(this.el);
              this.colocada = true;
              this.el.classList.remove('agarrable');
              esferaColocada(this.data.color);
            } else {
              // Aro equivocado: regresa a la cesta
              this.reiniciar();
            }
            return;
          }
        }

        this.anterior.copy(posicion);
        this.hayAnterior = true;
      },

      reiniciar: function () {
        if (this.mano) {
          this.mano.removeEventListener('mouseup', this.soltar);
          manosOcupadas.delete(this.mano);
          this.mano = null;
        }
        this.velocidadPendiente = null;
        this.hayAnterior = false;
        this.el.removeAttribute('dynamic-body');
        this.el.sceneEl.object3D.attach(this.el.object3D);
        this.el.object3D.position.copy(this.posicionInicial);
        this.el.setAttribute('dynamic-body', FISICA_ESFERA);
        this.el.classList.add('agarrable');
        this.colocada = false;
      }
    });


    /* Se llama cada vez que una esfera se encesta en su canasta */
    function esferaColocada(nombreColor) {
      colocadas++;
      conteo[nombreColor]++;

      // AVISO EN PANTALLA: "ROJO: 1/3" durante DURACION_AVISO milisegundos
      const info = COLORES.find(function (c) { return c.nombre === nombreColor; });
      document.querySelector('#aviso').components['aviso-puntos'].mostrar(
        nombreColor.toUpperCase() + ': ' + conteo[nombreColor] + '/' + ESFERAS_POR_COLOR,
        info.hex
      );

      // CONCEPTO 2: SONIDO ESPACIAL
      // La campana está en lo alto de la torre. El sonido sale DESDE ahí:
      // se oye más fuerte si estás cerca y del lado donde está.
      // En Unity: un AudioSource con "Spatial Blend" en 3D.
      document.querySelector('#campana').components.sound.playSound();

      actualizarPanel();
    }


    /* =====================================================================
       AVISO EN PANTALLA (HUD)
       Es un texto pegado a la cámara: se ve igual en la computadora y dentro
       del visor. Aparece arriba, pequeño y semitransparente (sin estorbar),
       y se esconde solo después de DURACION_AVISO. Se dibuja siempre encima
       de todo, así que ningún muro lo tapa.
       ===================================================================== */
    AFRAME.registerComponent('aviso-puntos', {
      init: function () {
        this.temporizador = null;
      },

      mostrar: function (texto, color) {
        const el = this.el;
        const letrero = el.querySelector('a-text');
        letrero.setAttribute('value', texto);
        letrero.setAttribute('color', color);
        el.setAttribute('visible', true);

        // Siempre encima de la escena (sin que los muros lo oculten)
        el.object3D.traverse(function (o) {
          if (o.material) {
            o.material.depthTest = false;
            o.material.depthWrite = false;
            o.renderOrder = 999;
          }
        });

        clearTimeout(this.temporizador);       // si encestas otra antes de que termine, reinicia el tiempo
        this.temporizador = setTimeout(function () {
          el.setAttribute('visible', false);
        }, DURACION_AVISO);
      }
    });


    /* =====================================================================
       LANZAR LA ESFERA QUE TIENES EN LA MANO
       No se crea ninguna pelota nueva: solo se lanza lo que ya agarraste.
       Si la mano está vacía, no pasa nada.
       - Computadora: F lanza la esfera que sostienes con el mouse, hacia donde mira la cámara.
       - Quest: el grip derecho lanza hacia donde apunta el láser del control que la sostiene.
       ===================================================================== */
    function direccionDeLanzamiento(manoEl) {
      const dir = new THREE.Vector3();

      // Computadora: hacia donde mira la cámara
      const camara = manoEl.getObject3D('camera');
      if (camara) {
        camara.getWorldDirection(dir);
        return dir;
      }

      // Quest: la misma línea del láser del control
      const rc = manoEl.components.raycaster;
      const rayo = rc && rc.raycaster ? rc.raycaster.ray : null;
      if (rayo && rayo.direction.lengthSq() > 0) return dir.copy(rayo.direction);

      // Respaldo: la orientación del control (su frente es -Z)
      manoEl.object3D.getWorldDirection(dir).negate();
      return dir;
    }

    // Lanza la esfera que sostiene esa mano. Devuelve true si había una.
    function lanzarDesde(manoEl) {
      const esfera = manosOcupadas.get(manoEl);
      if (!esfera) return false;
      esfera.lanzar(direccionDeLanzamiento(manoEl));
      return true;
    }

    /* Grip DERECHO del Quest → lanzar.
       Primero intenta con la esfera de la mano derecha; si está vacía,
       con la de la izquierda. */
    AFRAME.registerComponent('lanzador-grip', {
      init: function () {
        this.el.addEventListener('gripdown', () => {
          if (lanzarDesde(this.el)) return;
          lanzarDesde(document.querySelector('#mano-izquierda'));
        });
      }
    });

    /* Grip IZQUIERDO del Quest → correr mientras lo mantienes presionado */
    AFRAME.registerComponent('correr-grip', {
      init: function () {
        this.el.addEventListener('gripdown', function () { corriendoGrip = true; });
        this.el.addEventListener('gripup', function () { corriendoGrip = false; });
        this.el.addEventListener('controllerdisconnected', function () { corriendoGrip = false; });
      }
    });

    /* laser-controls podría usar también el botón grip para "hacer clic" (y por lo tanto agarrar).
       Aquí fijamos que SOLO el gatillo hace clic. Así grip = lanzar/correr y gatillo = agarrar,
       y una misma pulsación nunca hace las dos cosas. */
    AFRAME.registerComponent('solo-gatillo', {
      init: function () {
        const fijar = () => {
          this.el.setAttribute('cursor', { downEvents: ['triggerdown'], upEvents: ['triggerup'] });
        };
        fijar();
        this.el.addEventListener('controllerconnected', fijar);  // por si laser-controls lo reconfigura al conectar
      }
    });


    /* =====================================================================
       GIRAR LA VISTA CON EL JOYSTICK DERECHO (giro por pasos)
       Los controles y la cámara están dentro de #giro, que está dentro de #rig.
       - #rig sigue a la esfera de los pies (no se gira).
       - #giro es el que gira sobre el eje vertical.
       Girar #giro directamente haría que la cabeza "orbite" alrededor de su centro.
       Por eso, después de girar, movemos #giro lo necesario para que la cabeza
       quede EXACTAMENTE en el mismo lugar: el giro es sobre tu ubicación actual.
       ===================================================================== */
    function girarUsuario(grados) {
      const rig = document.querySelector('#rig').object3D;
      const giro = document.querySelector('#giro').object3D;
      const camara = document.querySelector('#camara').getObject3D('camera');
      if (!camara) return;

      // Dónde está la cabeza ahora, medida en el espacio del rig
      const cabeza = new THREE.Vector3();
      camara.getWorldPosition(cabeza);
      rig.worldToLocal(cabeza);

      const rad = grados * Math.PI / 180;
      const c = Math.cos(rad);
      const s = Math.sin(rad);

      // Cabeza relativa al pivote actual (la posición de #giro)
      const dx = cabeza.x - giro.position.x;
      const dz = cabeza.z - giro.position.z;

      // Nuevo pivote: el que deja la cabeza en el mismo punto después de girar
      giro.position.x = cabeza.x - (dx * c + dz * s);
      giro.position.z = cabeza.z - (-dx * s + dz * c);
      giro.rotation.y += rad;
    }

    AFRAME.registerComponent('giro-por-pasos', {
      init: function () {
        this.listo = true;     // ¿ya regresó la palanca al centro?

        this.el.addEventListener('thumbstickmoved', (e) => {
          const x = e.detail.x;
          const y = e.detail.y;

          // Después de un paso, hay que devolver la palanca al centro para permitir otro
          if (!this.listo) {
            if (Math.hypot(x, y) < UMBRAL_CENTRO_GIRO) this.listo = true;
            return;
          }

          // Zona muerta: solo cuenta si empujas fuerte y más hacia los lados que hacia adelante/atrás
          if (Math.abs(x) >= ZONA_MUERTA_GIRO && Math.abs(x) > Math.abs(y)) {
            // Palanca a la derecha → girar a la derecha (rotación negativa en Y)
            girarUsuario(x > 0 ? -PASO_GIRO : PASO_GIRO);
            this.listo = false;
          }
        });
      }
    });


    /* CONCEPTO 3: INTERFAZ DENTRO DEL MUNDO
       El panel es un plano con textos que flota en la escena.
       Para cambiar lo que dice, se cambia el atributo "value" del texto.
       En Unity: un Canvas en modo "World Space". */
    function actualizarPanel() {
      document.querySelector('#texto-marcador')
        .setAttribute('value', 'Esferas: ' + colocadas + ' / ' + TOTAL);
      if (colocadas === TOTAL) {
        document.querySelector('#texto-instruccion').setAttribute('value', 'Castillo completado!');
      }
    }

    function reiniciar() {
      colocadas = 0;
      COLORES.forEach(function (c) { conteo[c.nombre] = 0; });

      // Vaciamos los tubos de las canastas...
      document.querySelectorAll('[canasta]').forEach(function (cesta) {
        cesta.components.canasta.vaciar();
      });
      // ...y regresamos todas las esferas a la cesta
      document.querySelectorAll('[agarrable]').forEach(function (esfera) {
        esfera.components.agarrable.reiniciar();
      });

      document.querySelector('#texto-instruccion')
        .setAttribute('value', 'Mete cada esfera en el tubo de su color');
      actualizarPanel();
    }


    /* Botón del panel: responde al cursor o al láser con el evento "click" */
    AFRAME.registerComponent('boton-reiniciar', {
      init: function () {
        this.el.addEventListener('click', reiniciar);
        this.el.addEventListener('mouseenter', () => this.el.setAttribute('color', '#FFD27F'));
        this.el.addEventListener('mouseleave', () => this.el.setAttribute('color', '#FFB547'));
      }
    });


    /* Palanca izquierda del control del Quest → caminar */
    AFRAME.registerComponent('palanca-caminar', {
      init: function () {
        this.el.addEventListener('thumbstickmoved', function (e) {
          palanca.x = e.detail.x;
          palanca.y = e.detail.y;
        });
      }
    });


    /* Botón A del control DERECHO del Quest → saltar */
    AFRAME.registerComponent('boton-saltar', {
      init: function () {
        this.el.addEventListener('abuttondown', function () {
          quiereSaltar = true;
        });
      }
    });


    /* Teclado: guardamos qué teclas están presionadas.
       R = reiniciar, Espacio = saltar, Shift = correr, F = lanzar la esfera que tienes agarrada */
    window.addEventListener('keydown', function (e) {
      teclas[e.code] = true;
      if (e.code === 'KeyR') reiniciar();
      if (e.code === 'KeyF' && !e.repeat) lanzarDesde(document.querySelector('#camara'));
      if (e.code === 'Space') {
        quiereSaltar = true;
        e.preventDefault();                  // que la página no haga scroll
      }
    });
    window.addEventListener('keyup', function (e) { teclas[e.code] = false; });
  </script>
</head>

<body>
  <!-- physics: gravity es la aceleración en Y (m/s²).
       PRUEBA CAMBIAR: -1.62 (Luna) o -24.8 (Júpiter).
       Pon debug: true para ver en alambre las formas físicas. -->
  <a-scene physics="gravity: -9.8; restitution: 0.3; friction: 0.2; iterations: 20; debug: false">

    <!-- El sonido debe estar en la misma carpeta que este HTML -->
    <a-assets>
      <audio id="sonido-campana" src="campana.wav" preload="auto"></audio>
    </a-assets>

    <a-sky color="#BFE3F2"></a-sky>
    <a-light type="ambient" intensity="0.6"></a-light>
    <a-light type="directional" intensity="0.8" position="3 6 4"></a-light>

    <!-- PISO (estático). Es una caja de 1 m de grueso con la cara de arriba en y = 0.
         Si fuera muy delgado, una esfera que cae rápido podría atravesarlo
         (en un solo cuadro avanza más de lo que mide el piso). -->
    <a-box static-body position="0 -0.5 -3" width="30" height="1" depth="30" color="#7BC8A4"></a-box>


    <!-- ================= CASTILLO (todo es static-body) =================
         Patio: de x = -5 a 5, y de z = 0 a -10.
         Terraza (segundo piso) al fondo, a 1.2 m de altura.            -->

    <!-- Muro del frente, con puerta de 2.4 m en medio -->
    <a-box static-body position="-3.1 1.25 0" width="3.8" height="2.5" depth="0.3" color="#9A9488"></a-box>
    <a-box static-body position="3.1 1.25 0" width="3.8" height="2.5" depth="0.3" color="#9A9488"></a-box>

    <!-- Muros de los lados y del fondo -->
    <a-box static-body position="-5 1.25 -5" width="0.3" height="2.5" depth="10" color="#8C867A"></a-box>
    <a-box static-body position="5 1.25 -5" width="0.3" height="2.5" depth="10" color="#8C867A"></a-box>
    <a-box static-body position="0 2 -10" width="10.3" height="4" depth="0.3" color="#8C867A"></a-box>

    <!-- Terraza: una caja maciza de 1.2 m de alto -->
    <a-box static-body position="0 0.6 -8.5" width="10" height="1.2" depth="3" color="#A59F92"></a-box>

    <!-- RAMPA: sube 1.2 m en 3.5 m de largo (unos 19°).
         PRUEBA CAMBIAR: el ángulo en rotation y verás si el personaje aún puede subir. -->
    <a-box static-body position="-3.8 0.505 -5.28" rotation="18.92 0 0"
           width="1.5" height="0.2" depth="3.7" color="#8D6E63"></a-box>

    <!-- Torre en la esquina de la terraza -->
    <a-box static-body position="4 2.7 -9" width="1.5" height="3" depth="1.5" color="#857F73"></a-box>


    <!-- ================= CESTA donde caen las esferas al inicio =================
         Una caja sin tapa de 1.6 × 1.6 m (cuatro paredes) con centro en x = 2.5, z = -3.
         Es más grande para que quepan todas las esferas.                          -->
    <a-box static-body position="2.5 0.2 -2.2" width="1.6" height="0.4" depth="0.1" color="#5D4037"></a-box>
    <a-box static-body position="2.5 0.2 -3.8" width="1.6" height="0.4" depth="0.1" color="#5D4037"></a-box>
    <a-box static-body position="1.7 0.2 -3"   width="0.1" height="0.4" depth="1.6" color="#5D4037"></a-box>
    <a-box static-body position="3.3 0.2 -3"   width="0.1" height="0.4" depth="1.6" color="#5D4037"></a-box>

    <!-- ================= ESFERAS QUE SE AGARRAN =================
         No están escritas aquí: el componente crear-esferas (en el <script>)
         las crea con un ciclo, varias de cada color.
         PRUEBA CAMBIAR: ESFERAS_POR_COLOR o la lista COLORES en el script. -->
    <a-entity crear-esferas></a-entity>


    <!-- ================= CANASTAS DE BASKETBALL (una por color) =================
         Cada una es distinta: otro lugar, otra altura y el color de su aro.
         El componente "canasta" (en el <script>) construye poste, tablero, aro y el tubo de color
         donde se guardan las esferas encestadas.
           posicion → base del poste (x, y del piso, z). En la terraza el piso está en y = 1.2
           giro     → hacia dónde mira el aro (0 = +X, 90 = fondo, 180 = -X, -90 = la puerta)
           altura   → altura del aro sobre la base. PRUEBA CAMBIAR: 3.05 es la de un juego real -->

    <!-- ROJO: pared izquierda del patio, la más baja (aro a 2.0 m) -->
    <a-entity canasta="color: rojo; posicion: -4.45 0 -1.8; giro: 0; altura: 2.0"></a-entity>

    <!-- VERDE: pared derecha del patio, cerca de la entrada (aro a 2.5 m) -->
    <a-entity canasta="color: verde; posicion: 4.45 0 -1.0; giro: 180; altura: 2.5"></a-entity>

    <!-- AZUL: sobre la terraza, mirando al patio (aro a 1.2 + 1.8 = 3.0 m) -->
    <a-entity canasta="color: azul; posicion: 1.8 1.2 -9.55; giro: -90; altura: 1.8"></a-entity>

    <!-- AMARILLO: esquina izquierda de la terraza, la más alta (aro a 1.2 + 2.2 = 3.4 m) -->
    <a-entity canasta="color: amarillo; posicion: -4.45 1.2 -8.3; giro: 0; altura: 2.2"></a-entity>


    <!-- ================= CAMPANA con sonido 3D (encima de la torre) =================
         positional: true → el sonido sale desde aquí
         refDistance: 2   → a 2 m se oye normal; más lejos, más bajito          -->
    <a-entity id="campana" position="4 4.6 -9"
              sound="src: #sonido-campana; positional: true; refDistance: 2; volume: 1">
      <a-cone radius-bottom="0.35" radius-top="0.1" height="0.5" color="#E6B422"></a-cone>
      <a-sphere position="0 -0.28 0" radius="0.07" color="#8D6E63"></a-sphere>
    </a-entity>


    <!-- ================= PANEL FLOTANTE (interfaz en el mundo) ================= -->
    <a-entity position="-1.5 3.1 -9.8">
      <a-plane width="3" height="1.1" color="#1C2128" opacity="0.9"></a-plane>
      <a-text id="texto-instruccion" value="Mete cada esfera en el tubo de su color"
              align="center" width="3" position="0 0.3 0.01" color="#FFFFFF"></a-text>
      <!-- El número se escribe desde el script (actualizarPanel) -->
      <a-text id="texto-marcador" value="Esferas: 0"
              align="center" width="4" position="0 0 0.01" color="#FFB547"></a-text>
      <!-- Botón: tiene class="agarrable" para que el láser lo detecte,
           pero no el componente agarrable, así que no se mueve -->
      <a-plane class="agarrable" boton-reiniciar width="0.9" height="0.25"
               position="0 -0.35 0.01" color="#FFB547"></a-plane>
      <a-text value="Reiniciar" align="center" width="2.5" position="0 -0.35 0.02" color="#1C2128"></a-text>
    </a-entity>


    <!-- ================= JUGADOR ================= -->

    <!-- Esfera de los pies: invisible, con física. Empieza afuera de la puerta. -->
    <a-sphere id="pies" jugador visible="false" radius="0.35" position="0 0.35 4"
              dynamic-body="mass: 5; shape: sphere; sphereRadius: 0.35; angularDamping: 1"></a-sphere>

    <!-- Rig: sigue a la esfera de los pies (su posición la controla el componente jugador).
         Adentro está #giro, que es el que gira con el joystick derecho y
         contiene la cabeza (cámara) y las manos (controles). -->
    <a-entity id="rig" position="0 0 4">
      <a-entity id="giro">

        <!-- COMPUTADORA: el mouse apunta. Mantén el clic sobre una esfera para cargarla
             (arrastra para girar la vista) y suelta el clic para dejarla caer.
             WASD camina, SHIFT corre, ESPACIO salta.
             F lanza la esfera que tienes agarrada hacia donde mira la cámara.

             AVISO EN PANTALLA (#aviso): va pegado a la cámara, así se ve en la
             computadora y dentro del visor. Es invisible hasta que encestas;
             entonces muestra "ROJO: 1/3" durante DURACION_AVISO (1.5 s). -->
        <a-entity id="camara" camera look-controls position="0 1.6 0"
                  cursor="rayOrigin: mouse" raycaster="objects: .agarrable">
          <a-entity id="aviso" aviso-puntos visible="false" position="0 0.5 -1.2">
            <a-plane width="0.7" height="0.16" color="#000000"
                     material="opacity: 0.45; transparent: true; depthTest: false"></a-plane>
            <a-text value="" align="center" width="1.6" color="#FFFFFF" position="0 0 0.01"></a-text>
          </a-entity>
        </a-entity>

        <!-- QUEST: apunta con el láser y mantén el GATILLO para agarrar una esfera.
             Grip DERECHO: lanza la esfera que tienes agarrada.
             Grip IZQUIERDO (mantenido): correr.
             Palanca IZQUIERDA: caminar.
             Palanca DERECHA: girar la vista de 30 en 30 grados.
             Botón A del control DERECHO: saltar. -->
        <a-entity id="mano-derecha" laser-controls="hand: right"
                  raycaster="objects: .agarrable; far: 6"
                  solo-gatillo boton-saltar giro-por-pasos lanzador-grip></a-entity>
        <a-entity id="mano-izquierda" laser-controls="hand: left"
                  raycaster="objects: .agarrable; far: 6"
                  solo-gatillo palanca-caminar correr-grip></a-entity>

      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
